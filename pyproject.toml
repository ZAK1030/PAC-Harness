[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PAC-Harness"
version = "0.1.0"
description = "Planner, Detector, ToUser and post-run Analyzer runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
robot-vision = ["numpy>=1.24", "Pillow>=10", "msgpack>=1.0"]
piper = ["piper-sdk==0.6.2; sys_platform == 'linux'"]
franka = ["franky-control>=2.0,<3; sys_platform == 'linux'"]

[project.scripts]
PAC-Harness = "pac_harness.__main__:main"
PAC-Analyze = "pac_harness.post_run:main"

[tool.setuptools.packages.find]
include = ["pac_harness*", "examples*", "adapters*"]
